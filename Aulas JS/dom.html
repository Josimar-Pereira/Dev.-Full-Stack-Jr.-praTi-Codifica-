<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <h1>Estudos DOM</h1>
    <p>Aprendendo a usar o DOM em JavaScript</p>
    <p>Aqui vai mudar</p>
    <script>
        window.document.write("Olá Mundo!");
        let novoTexto = document.getElementsByTagName("p")[1]
        novoTexto.innerHTML = "Aqui vai mudar.</br>Manipulando o DOM!"
        novoTexto.style.color = 'red'
        let novaTag = document.createElement('h1');
        novaTag.innerHTML = "Deu certo!";  
        novaTag.style.textAlign = 'center'  
        document.body.appendChild(novaTag);
    </script>
</body>
</html>
